name: Spate MCP Server
description: 'Spate operates a live, remote Model Context Protocol server at https://api.spate.nyc/mcp
  that exposes its consumer trend intelligence — the Spate popularity index, TikTok and Reddit time series,
  category taxonomy and affinity-group relationships — as four MCP tools. The server answers anonymous
  `initialize` and `tools/list` calls, so the real tool set and its JSON Schema input contracts are publicly
  readable, but every `tools/call` is rejected with JSON-RPC error -32001 "Missing Authorization: Bearer
  token" until an OAuth 2.1 access token is presented. Spate publishes no OpenAPI, no GraphQL schema and
  no public reference for this surface; the tool manifest captured here IS the machine-readable contract.'
