ownership:
  host: api.spate.nyc
  justification: >-
    api.spate.nyc is a subdomain of spate.nyc, the company's own registered
    domain. The MCP serverInfo self-identifies as `spate_api`, the OAuth
    issuer is https://api.spate.nyc/mcp, the API host root responds
    "Greetings from Spate API", and the tool vocabulary (popularity index,
    cat1-cat5 taxonomy, beauty/wellness affinity groups) matches the product
    Spate documents on its own help center.
