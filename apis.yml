apis:
- name: Spate API
  description: 'The Spate API surface is reached at api.spate.nyc. Its only publicly
    discoverable contract is a remote Model Context Protocol server at
    https://api.spate.nyc/mcp, which answers anonymous initialize and tools/list
    calls and exposes four read-only tools — top_trends, time_series,
    top_related_trends and find_category — over Spate''s five-level consumer
    taxonomy, six regions, and the popularity index, TikTok and Reddit data
    sources. Tool invocation requires an OAuth 2.1 bearer token with scope mcp.
    Spate separately sells Brand Data and Trend Data API access as a subscription
    add-on requiring at least 5 seats, manually configured by its technical team;
    no OpenAPI, reference, or SDK is published for either surface.'
