aid: spate
name: Spate
description: 'Spate is an AI-powered consumer trend forecasting and market intelligence
  platform for beauty, wellness, and food and beverage brands. It analyzes hundreds
  of billions of search signals and hundreds of millions of social posts across TikTok,
  Instagram, Reddit, and Google to predict emerging trends, benchmark competitors,
  surface whitespace opportunities, and track viral content and sentiment. Used by
  200+ brands including Sephora, L''Oreal, P&G, Unilever, and e.l.f. Beauty across
  marketing, R&D, sales, and retail teams. Spate operates a live remote Model Context
  Protocol server at https://api.spate.nyc/mcp that exposes four trend-intelligence
  tools to AI agents, plus a sales-provisioned Brand Data and Trend Data API sold as
  a subscription add-on. Neither surface has a published OpenAPI, developer portal,
  SDK, or self-serve API key: Spate states that API integrations are manually
  configured by its technical team.'
